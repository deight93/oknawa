name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-config:
    name: Supabase config check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup deployment CLI
        uses: supabase/setup-cli@v2
        with:
          # Keep in sync with supabase-deploy.yml.
          version: 2.122.1

      - name: Parse local Supabase configuration
        # services may print config errors but still exit 0; check stderr too.
        run: |
          config_errors=$(mktemp)
          trap 'cat "$config_errors" >&2; rm -f "$config_errors"' EXIT
          supabase services --log-level error 2>"$config_errors"
          # The pinned v2 CLI always prints these two upgrade-notice lines.
          if grep -Ev '^(A new version of Supabase CLI is available:|We recommend updating regularly for new features and bug fixes:|[[:space:]]*$)' "$config_errors"; then
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        # The unpatched low-severity theme dependency is documented in docs/dependency-security.md.
        run: pnpm audit --audit-level=moderate

      - name: Agent harness contracts
        run: pnpm agent:harness:quick

      - name: Application and RPC regression tests
        run: pnpm test:app

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify rendered SEO metadata
        run: node scripts/check-seo.mjs

  supabase-functions:
    name: Supabase functions check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Check Edge Functions
        run: |
          deno check --no-lock --config supabase/functions/location-meeting/deno.json supabase/functions/location-meeting/index.ts
          deno check --no-lock --config supabase/functions/location-meeting-terminal/deno.json supabase/functions/location-meeting-terminal/index.ts
          deno check --no-lock --config supabase/functions/location-point-place/deno.json supabase/functions/location-point-place/index.ts
          deno check --no-lock --config supabase/functions/location-points/deno.json supabase/functions/location-points/index.ts
          deno check --no-lock --config supabase/functions/location-destination/deno.json supabase/functions/location-destination/index.ts

      - name: Test Edge Function libraries
        run: deno test --no-lock --allow-read=supabase/migrations --config supabase/functions/location-points/deno.json supabase/functions/tests/*.test.ts
